# SonarQube Cloud の自動解析の設定。アプリ部分 (Vite + React の画面と FastAPI) だけを対象にする
# パイプライン (backend/scripts・migrations と、API から使っていない services) は入れない

sonar.sources=frontend/src,backend/app,main.py
sonar.exclusions=\
  backend/app/services/gemini.py,\
  backend/app/services/pipeline_common.py,\
  backend/app/services/series_parser.py,\
  backend/app/services/twitter.py,\
  backend/app/services/query_splitter.py,\
  frontend/src/assets/**

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
